    <h1>Sélection du véhicule, du moteur et spécificités</h1>

                <label for="modele">Modèle :</label>

            <dd class="niveau-4">
                Description :

            </dd>
        </dl>

        const marqueSelect = document.getElementById("marque");
        const modeleSelect = document.getElementById("modele");
        const moteurSelect = document.getElementById("moteur");
        const resDescription = document.getElementById("res-description");
        const form = document.getElementById("formulaire-selection");

        function initialiserMarques() {
            Object.keys(catalogueVehicules).sort((a, b) => a.localeCompare(b, "fr")).forEach((marque) => {
                const option = document.createElement("option");
                option.value = marque;
                option.textContent = marque;
                marqueSelect.appendChild(option);
            });
        }

        function remplirModeles(marque) {
            modeleSelect.innerHTML = '<option value="">-- Choisir un modèle --</option>';
            moteurSelect.innerHTML = '<option value="">-- Choisir un moteur --</option>';
            moteurSelect.disabled = true;

            if (catalogueVehicules[marque]) {
                Object.keys(catalogueVehicules[marque]).forEach((modele) => {
                    const option = document.createElement("option");
                    option.value = modele;
                    option.textContent = modele;
                    modeleSelect.appendChild(option);
                });
                modeleSelect.disabled = false;
            } else {
                modeleSelect.disabled = true;
            }
        }

        function remplirMoteurs(marque, modele) {
            moteurSelect.innerHTML = '<option value="">-- Choisir un moteur --</option>';

            if (catalogueVehicules[marque] && catalogueVehicules[marque][modele]) {
                Object.keys(catalogueVehicules[marque][modele]).forEach((moteur) => {
                    const option = document.createElement("option");
                    option.value = moteur;
                    option.textContent = moteur;
                    moteurSelect.appendChild(option);
                });
                moteurSelect.disabled = false;
            } else {
                moteurSelect.disabled = true;
            }
        }

        marqueSelect.addEventListener("change", () => {
            remplirModeles(marqueSelect.value);
            resDescription.textContent = "—";
        });

        modeleSelect.addEventListener("change", () => {
            remplirMoteurs(marqueSelect.value, modeleSelect.value);
            resDescription.textContent = "—";
        });

        moteurSelect.addEventListener("change", () => {
            const marqueChoisie = marqueSelect.value;
            const modeleChoisi = modeleSelect.value;
            const moteurChoisi = moteurSelect.value;

            const specs =
                catalogueVehicules[marqueChoisie] &&
                catalogueVehicules[marqueChoisie][modeleChoisi] &&
                catalogueVehicules[marqueChoisie][modeleChoisi][moteurChoisi];

            resDescription.textContent = specs || "—";
        });

        form.addEventListener("reset", () => {
            setTimeout(() => {
                remplirModeles("");
                resDescription.textContent = "—";
            }, 0);
        });

        initialiserMarques();
    </script>
